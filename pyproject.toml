[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miter"
version = "0.2.0"
description = "MITER — a deterministic workflow-evaluation DSL with a natural-language compiler"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "taretakt" }]
keywords = ["dsl", "evaluation", "workflow", "logistics", "compiler", "deterministic"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Compilers",
]

[project.scripts]
miter = "miter.cli:main"

[tool.setuptools.packages.find]
include = ["miter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
